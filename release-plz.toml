# release-plz configuration: https://release-plz.dev/docs/config
[workspace]
# Versions come from `vX.Y.Z` git tags instead of crates.io; nothing is published to a registry.
git_only = true
# Release only when a release PR is merged, not on every push with an untagged version.
release_always = false
git_tag_name = "v{{ version }}"
git_release_enable = true
changelog_update = true
dependencies_update = false
semver_check = false
pr_labels = ["release"]
