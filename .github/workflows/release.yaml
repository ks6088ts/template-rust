name: release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag (for example v1.2.3) to build binaries for.
        required: true
        type: string

permissions: {}

env:
  BIN_NAME: template-rust
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install Rust toolchain from rust-toolchain.toml
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" --bin "$BIN_NAME"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        run: |
          name="${BIN_NAME}-${TAG}-${TARGET}"
          mkdir -p "staging/$name" dist
          cp README.md LICENSE CHANGELOG.md "staging/$name/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "target/$TARGET/release/$BIN_NAME.exe" "staging/$name/"
            (cd staging && 7z a -tzip "../dist/$name.zip" "$name" >/dev/null)
          else
            cp "target/$TARGET/release/$BIN_NAME" "staging/$name/"
            tar -C staging -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
