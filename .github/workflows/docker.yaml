name: docker

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy v0.74.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.74.0 --repo aquasecurity/trivy \
            --pattern 'trivy_0.74.0_Linux-64bit.tar.gz' \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run CI tests for Docker
        run: make ci-test-docker
